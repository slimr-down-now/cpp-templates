name: test
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run_tests: ${{ steps.classify.outputs.run_tests }}
      runners: ${{ steps.platforms.outputs.runners || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - id: platforms
        run: |
          runners="$(just --evaluate platforms | jq -Rc 'split(" ") | map(select(length > 0) | {macos: "macos-26", linux: "ubuntu-24.04"}[.] // error("unknown platform: \(.)"))')"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"
      - id: classify
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_ref="${{ github.base_ref }}"
          git fetch origin "$base_ref" --depth=1
          mapfile -t changed < <(git diff --name-only "origin/${base_ref}...HEAD")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only="$(bun scripts/release.ts classify "${changed[@]}")"
          if [ "$docs_only" = "true" ]; then
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: gate
    if: github.event_name == 'pull_request' && needs.gate.outputs.run_tests == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup
        if: hashFiles('ports/*/vcpkg.json') != ''
      - uses: extractions/setup-just@v3
        if: hashFiles('ports/*/vcpkg.json') == ''
      - uses: oven-sh/setup-bun@v2
        if: hashFiles('ports/*/vcpkg.json') == ''
      - name: Configure git author
        run: |
          git config user.name "bdombro-release-bot[bot]"
          git config user.email "bdombro-release-bot[bot]@users.noreply.github.com"
      - name: Prepare PR release bump
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          before="$(git rev-parse HEAD)"
          git fetch origin "${{ github.base_ref }}" --depth=1
          bun scripts/release.ts prep --base "origin/${{ github.base_ref }}" --labels "$PR_LABELS" --commit
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ]; then
            git push origin "HEAD:refs/heads/${{ github.head_ref }}"
          fi

  test:
    needs: [gate, bump]
    if: needs.gate.outputs.run_tests == 'true' && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    env:
      BUGSINK_DSN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just test
      - run: just lint
      - if: hashFiles('scripts/test-mcp.ts') != ''
        run: just test-mcp

  ci:
    needs: [gate, test]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "::error::gate=${{ needs.gate.result }}"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "::error::test=${{ needs.test.result }}"
            exit 1
          fi
