name: release
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      runners: ${{ steps.plan.outputs.runners || '[]' }}
      kind: ${{ steps.plan.outputs.kind }}
      name: ${{ steps.plan.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - id: plan
        run: |
          runners="$(just --evaluate platforms | jq -Rc 'split(" ") | map(select(length > 0) | {macos: "macos-26", linux: "ubuntu-24.04"}[.] // error("unknown platform: \(.)"))')"
          shopt -s nullglob
          formulas=(Formula/*.rb)
          casks=(Casks/*.rb)
          ports=(ports/*/vcpkg.json)
          if [ "${#formulas[@]}" -eq 1 ]; then
            kind="formula"
            name="$(basename "${formulas[0]}" .rb)"
            version="$(tr -d '[:space:]' < VERSION)"
          elif [ "${#casks[@]}" -eq 1 ]; then
            kind="cask"
            name="$(basename "${casks[0]}" .rb)"
            version="$(tr -d '[:space:]' < VERSION)"
          elif [ "${#ports[@]}" -eq 1 ]; then
            kind="library"
            name="$(basename "$(dirname "${ports[0]}")")"
            version="$(jq -r '.version' "${ports[0]}")"
          elif [ "${#ports[@]}" -gt 1 ]; then
            kind="library"
            name="$(just --evaluate formula 2>/dev/null || true)"
            if [ -z "$name" ] && [ -f vcpkg.json ]; then
              name="$(jq -r '.name // empty' vcpkg.json)"
            fi
            if [ -z "$name" ]; then
              name="$(basename "$GITHUB_WORKSPACE")"
            fi
            version="$(jq -r '.version' "ports/${name}/vcpkg.json")"
          else
            echo "::error::Cannot determine repository kind (Formula/*.rb, Casks/*.rb, or ports/*/vcpkg.json)"
            exit 1
          fi
          should_release=true
          if git ls-remote --exit-code origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists on origin; skipping release"
            should_release=false
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            mapfile -t changed < <(git diff --name-only HEAD~1..HEAD)
            if [ "${#changed[@]}" -gt 0 ] && [ "$(bun scripts/release.ts classify "${changed[@]}")" = "true" ]; then
              echo "Docs-only merge; skipping release"
              should_release=false
            fi
          fi
          {
            echo "should_release=$should_release"
            echo "version=$version"
            echo "runners=$runners"
            echo "kind=$kind"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.should_release == 'true' && needs.plan.outputs.kind != 'library'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    env:
      BUGSINK_DSN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build release
        run: just build
      - name: Package release asset
        run: |
          name="${{ needs.plan.outputs.name }}"
          kind="${{ needs.plan.outputs.kind }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            target="arm64-macos"
          else
            target="x64-linux"
          fi
          if [ "${{ runner.os }}" = "macOS" ] && [ -d build/bin ]; then
            while IFS= read -r bin; do
              bad_libs="$(otool -L "$bin" | tail -n +2 | sed -E 's/^[[:space:]]+([^[:space:]]+).*/\1/' | grep -Ev '^(/System/Library/|/usr/lib/libSystem\.B\.dylib$|/usr/lib/libobjc\.A\.dylib$)' || true)"
              if [ -n "$bad_libs" ]; then
                echo "::error::macOS release binary $bin links unexpected libraries: $bad_libs"
                exit 1
              fi
              exported="$(nm -gU "$bin")"
              if [ -n "$exported" ]; then
                echo "::error::macOS release binary $bin must not export symbols (missing -Wl,-exported_symbols_list,/dev/null)"
                exit 1
              fi
            done < <(find build/bin -type f -perm -u+x)
          fi
          if [ "$kind" = "formula" ]; then
            if [ "${{ runner.os }}" = "Linux" ]; then
              if ldd build/bin/* | grep -q 'libc++\.so'; then
                echo "::error::Linux release binary must not dynamically link libc++.so"
                exit 1
              fi
              "build/bin/$name" --version
            fi
            if [ ! -f "dist/${name}-${target}.tar.gz" ]; then
              mkdir -p dist
              tar -czf "dist/${name}-${target}.tar.gz" -C build/bin .
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/${{ needs.plan.outputs.name }}-*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.should_release == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        if: needs.plan.outputs.kind != 'library'
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ needs.plan.outputs.kind != 'library' && steps.app-token.outputs.token || github.token }}
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.kind != 'library'
        with:
          path: assets
          merge-multiple: true
      - name: Configure git author
        run: |
          git config user.name "$(git log -1 --format='%an')"
          git config user.email "$(git log -1 --format='%ae')"
      - env:
          GH_TOKEN: ${{ needs.plan.outputs.kind != 'library' && steps.app-token.outputs.token || github.token }}
        run: bun scripts/release.ts publish "${{ needs.plan.outputs.version }}" assets
