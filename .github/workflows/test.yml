name: test
on: [workflow_dispatch, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      BUGSINK_DSN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install macOS toolchain
        if: runner.os == 'macOS' && hashFiles('templates/*/justfile') != ''
        run: brew install llvm@23 ninja jq
      - name: Install Linux toolchain
        if: runner.os == 'Linux' && hashFiles('templates/*/justfile') != ''
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install llvm@23 ninja jq
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          {
            echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX"
            echo "HOMEBREW_CELLAR=$HOMEBREW_CELLAR"
            echo "HOMEBREW_REPOSITORY=$HOMEBREW_REPOSITORY"
          } >> "$GITHUB_ENV"
      - name: Setup vcpkg
        if: hashFiles('templates/*/justfile') != ''
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "$RUNNER_TEMP/vcpkg" >> "$GITHUB_PATH"
          {
            echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache"
          } >> "$GITHUB_ENV"
      - run: just lint
      - run: just test

  ci:
    needs: test
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Check test result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::test=${{ needs.test.result }}"
            exit 1
          fi
