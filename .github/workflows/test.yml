name: test
on: [workflow_dispatch, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      BUGSINK_DSN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Setup C++ toolchain
        if: hashFiles('templates/*/justfile') != ''
        run: |
          brew install llvm@23 ninja jq
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
      - run: just lint
      - run: just test
